<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTFlower - Gestión de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="/" class="logo-link">
                <span class="accent">UT</span>Flower <small>| Admin</small>
            </a>
        </div>
    </header>

    <main class="container">
        
        <section class="admin-panel">
            <h2>Nuevo Producto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="nombre">Nombre de la Flor</label>
                    <input type="text" id="nombre" placeholder="Ej. Rosa Roja" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required>
                        <option value="">Selecciona...</option>
                        <option value="Rosas">Rosas</option>
                        <option value="Tulipanes">Tulipanes</option>
                        <option value="Lirios">Lirios</option>
                        <option value="Ramos">Ramos Mixtos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($)</label>
                    <input type="number" id="precio" placeholder="0.00" min="0" step="0.50" required>
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" placeholder="0" min="0" required>
                </div>

                <div class="form-group">
                    <label for="imagen">Imagen (Opcional)</label>
                    <input type="file" id="imagen" accept="image/*">
                </div>

                <button type="submit" id="btn-save" class="btn-primary">Guardar Flor</button>
                <button type="button" id="btn-cancel" class="btn-secondary hidden">Cancelar</button>
            </form>
        </section>

        <section class="inventory-list">
            <div class="controls">
                <input type="text" id="search-input" placeholder="🔍 Buscar flor...">
                <select id="filter-category">
                    <option value="all">Todas las categorías</option>
                    <option value="Rosas">Rosas</option>
                    <option value="Tulipanes">Tulipanes</option>
                    <option value="Lirios">Lirios</option>
                </select>
            </div>

            <div class="table-container">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th width="80">Imagen</th> <th>Flor</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
                <p id="empty-msg" class="empty-msg hidden">No hay flores en el inventario.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
